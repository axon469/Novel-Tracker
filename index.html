<html lang="en" data-theme="dark" data-bg="dots">

<title>Novel Tracker DB</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.in:focus{border-color:var(--accent)}textarea.in{min-height:110px;resize:none}
.bt{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

#add{flex:none;width:52px;height:52px;margin:0 6px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center}

.th{padding:14px 20px;background:var(--raised);color:var(--muted)}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);margin:0 8px 0 6px;flex:none}.on>.rd{border:6px solid var(--accent)}

.tabs{display:flex;overflow-x:auto;padding:0 8px;border-bottom:1px solid var(--line);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tg{flex:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--cc,var(--text));opacity:.6;border-bottom:2px solid transparent;white-space:nowrap}.tg.on{opacity:1;border-color:var(--cc,var(--text))}.tg svg{width:18px;height:18px;display:block}
.row.it{min-height:0;padding:14px 18px}.row.it b{font-size:16px}
.fld{position:relative;margin-top:22px}.fld label{position:absolute;top:-9px;left:14px;padding:0 6px;background:var(--bg);font-size:13px;color:var(--muted);z-index:1}.fld .in{margin-top:0}.fld textarea.in{min-height:240px;overflow:hidden}
#menu{position:fixed;inset:0;z-index:25;display:none}#menu.on{display:block}
.mb{position:absolute;width:176px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.mb button{display:block;width:100%;height:42px;padding:0 14px;border-radius:10px;font-size:15px}.mb button:active{background:var(--raised)}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:10px;cursor:pointer}.ci:active{background:var(--raised)}
.pb{height:8px;border-radius:4px;background:var(--raised);margin:18px 0 10px;overflow:hidden}.pb i{display:block;height:100%;width:1%;background:var(--accent);transition:width .15s}
.mt{color:var(--muted);font-size:15px;margin-top:10px}

.card.sl{padding:18px 22px;gap:8px}
.mo{color:var(--text)}.mo svg{stroke-width:4.4}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.swb{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.swb.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--text)}
.ir{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}.ir span{color:var(--muted)}.ir b{font-weight:600;text-align:right;word-break:break-word}
.sr{display:flex;align-items:center;justify-content:space-between;padding:15px 6px;font-size:16px}
.sw,.cb{-webkit-appearance:none;appearance:none;flex:none;position:relative;border:2px solid var(--muted);background:transparent}
.sw{width:52px;height:30px;border-radius:15px;background:var(--raised)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.sw:checked{background:var(--accent);border-color:var(--accent)}.sw:checked::after{left:25px;background:var(--on)}
.cb{width:24px;height:24px;border-radius:7px}.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:12px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
#dlg.sheet{align-items:flex-end;padding:0}#dlg.sheet .bx{max-width:none;border-radius:28px 28px 0 0;border-bottom:0;max-height:90vh;overflow-y:auto;padding-bottom:calc(22px + var(--sab))}
.lst{max-height:220px;overflow-y:auto}
.tb{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 12px) 12px 6px 20px;min-height:60px}.srt{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--muted)}.srt svg{width:18px;height:18px}
.ll{display:grid;gap:10px}.lr{display:flex;align-items:center;gap:14px;padding:10px 6px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;cursor:pointer}
.rc{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:rgba(255,255,255,.85)}
.lt{flex:1;min-width:0;font-weight:600;font-size:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{padding:8px 14px;border-radius:18px;border:1px solid var(--line);font-size:14px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}.chip .x{font-weight:400;opacity:.7;padding:0 2px}.chip.pl{padding:8px 16px}
.tgn{display:flex;gap:8px;margin-top:10px;align-items:center}.tgn .in{margin:0}.tgn .b1{height:48px;padding:0 18px}
.dev{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:6px}.dev small{color:var(--muted);font-size:13px}.dev span{font-size:15px}
.soc{display:flex;gap:10px;margin-top:6px}.soc a{width:40px;height:40px;border-radius:12px;background:var(--raised);display:grid;place-items:center;color:var(--muted)}.soc svg{width:20px;height:20px}.soc svg.f{fill:currentColor;stroke:none}
.bgopt+.bgopt{border-top:1px solid var(--line)}.bgopt>.row{border-top:0}
.ctl{padding:0 18px 20px 78px}.ctl label,.lbl-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted);margin-top:6px}.lbl-row{margin-top:18px}
.ctl output{color:var(--muted);font-size:13px}
.ctl .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:999px;font-size:15px;font-weight:600;margin-top:12px;background:var(--raised);text-align:center}.ctl .btn+.btn{margin-top:8px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0 6px;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:var(--raised)}.rng::-moz-range-track{height:6px;border-radius:9px;background:var(--raised)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--text);margin-top:-8px;border:3px solid var(--surface)}.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--surface)}
.thumb{display:block;width:100%;height:96px;object-fit:cover;border-radius:16px;margin-top:12px;border:1px solid var(--line)}
.ci .txt small{color:var(--text);font-size:15px}
.vchip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 9px;border-radius:17px;border:1.5px solid var(--accent);color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.03em;flex:none}.vchip svg{width:18px;height:18px}.vchip:active{background:var(--raised)}
.vrow{display:flex;align-items:center;gap:14px;padding:10px 8px 10px 10px;border:1.5px solid var(--line);border-radius:20px;margin-top:10px;cursor:pointer}.vrow.on{border-color:var(--accent);background:var(--raised)}
.vb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--raised);color:var(--muted);flex:none}.vrow.on .vb{background:var(--accent);color:var(--on)}
.vl{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-left:8px}
.kb nav,.kb .fab{display:none!important}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk,.cvl{background:linear-gradient(90deg,var(--surface) 30%,var(--raised) 50%,var(--surface) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.skc{aspect-ratio:2/3;border-radius:20px;border:1px solid var(--line)}.skr{height:72px;border-radius:18px;border:1px solid var(--line);margin-bottom:10px}
.sen{display:none;margin-top:12px}.sen.show{display:block}.sen.grid.show{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sen.grid .skc{margin:0}
.nv,.lr,.ci{content-visibility:auto}.nv{contain-intrinsic-size:auto 300px}.lr{contain-intrinsic-size:auto 78px}.ci{contain-intrinsic-size:auto 90px}
.swb.cust{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cpw{margin-top:14px}.cph{display:flex;align-items:center;gap:10px}.cpv{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}.cph b{flex:1;font-size:14px;font-weight:600;letter-spacing:.04em}
.cpok{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center}.cpok svg{width:20px;height:20px;stroke-width:2.6}
.cpr{position:relative;width:150px;height:150px;margin:10px auto 0;touch-action:none;--ch:#f00}
.cpring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 90deg,#f00,#f0f,#00f,#0ff,#0f0,#ff0,#f00);-webkit-mask:radial-gradient(circle,transparent 56px,#000 57px);mask:radial-gradient(circle,transparent 56px,#000 57px)}
.cpq{position:absolute;left:37px;top:37px;width:76px;height:76px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(to bottom,transparent,#000),linear-gradient(to right,#fff,var(--ch))}
.cpn{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
@media (prefers-reduced-motion:reduce){.sk,.cvl{animation:none}}
nav{width:min(calc(100% - 24px),430px)!important}.tab{font-size:10.5px}
.fv{width:34px;color:rgba(255,255,255,.75)}.fv svg{width:19px;height:19px}.fv.on{color:var(--accent)}.fv.on svg{fill:currentColor}
.lr .fv{color:var(--muted)}.lr .fv.on{color:var(--accent)}.lb .ib{width:34px}
.lt small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.hint{color:var(--muted);font-size:13px;margin:10px 6px}
.sb{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 10px) 8px 6px 14px;min-height:60px}
.si{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--muted)}.si svg{width:19px;height:19px}
.si input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;-webkit-user-select:text;user-select:text}
.rc2{font-size:12px;font-weight:700;color:var(--accent)}

.arow{display:flex;align-items:center;gap:8px;margin-top:12px}.arow>span{width:64px;flex:none;color:var(--muted);font-size:14px}.arow>i{font-style:normal;color:var(--muted)}
.arow .in{margin:0;padding:11px 12px;flex:1;min-width:0;font-size:15px}.arow .chips{margin:0;gap:6px}.arow .chip{padding:7px 12px}
.lt{display:block;-webkit-line-clamp:unset;overflow:visible}.ltt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lb{padding:5px 2px 5px 12px;min-height:50px;font-size:13.5px;gap:0}.lb span{line-height:1.25}
.lb .ib,.lb .fv{width:26px;height:32px}.lb .ib svg{width:18px;height:18px}.lb .fv svg{width:17px;height:17px}
.lr .ib,.lr .fv{width:32px}.lr .fv svg{width:18px;height:18px}.ltt,.lt{font-size:15px}
.ow{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:16px;border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700}.ow:active{background:var(--raised)}
.snr{min-height:60px;padding:8px 12px 8px 8px}.snr .chip{padding:6px 12px;margin-left:auto}.snr.on{background:var(--raised)}
.b1:disabled{opacity:.45}
main{scrollbar-width:thin}

</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app">
  <div id="hd"></div>
  <main id="mn"></main>
  <div id="fab"></div>
  <nav id="nav">
    <button class="tab" data-a="go" data-v="home" id="t-home"></button>
    <button class="tab" data-a="go" data-v="history" id="t-history"></button>
    <button id="add" data-a="add" aria-label="Add novel"></button>
    <button class="tab" data-a="srch" id="t-search"></button>
    <button class="tab" data-a="go" data-v="settings" id="t-settings"></button>
  </nav>
</div>
<div id="full"></div>
<div id="dlg"></div>
<div id="menu" data-a="mx"></div>
<div id="toast" role="status"></div>
<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="cf" accept="image/*" hidden>
<input type="file" id="imf" multiple hidden>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
