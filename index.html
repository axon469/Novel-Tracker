<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bg="dots">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Novel Tracker DB</title>
<style>
:root{
  --bg:#0b0b0c; --surface:#1a1a1c; --raised:#262629; --line:#2a2a2d;
  --text:#f2f2f2; --muted:#8d8d92; --accent:#d4a28a; --on-accent:#111; --dot:#2c2c30;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali",sans-serif;
}
:root[data-theme="light"]{
  --bg:#f6f5f3; --surface:#ffffff; --raised:#ece9e5; --line:#e4e2de;
  --text:#161616; --muted:#77767b; --accent:#c98e72; --on-accent:#161616; --dot:#dcd9d4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none}
html[data-bg="dots"] body::before{background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px}
html[data-bg="grid"] body::before{background-image:linear-gradient(var(--dot) 1px,transparent 1px),linear-gradient(90deg,var(--dot) 1px,transparent 1px);background-size:28px 28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;min-height:64px;padding:calc(var(--sat) + 12px) 20px 8px}
header h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
#back{display:none;width:44px;height:44px;margin-left:-12px;align-items:center;justify-content:center;border-radius:50%}
#back:active{background:var(--raised)}
main{flex:1;overflow-y:auto;padding:8px 16px calc(130px + var(--sab));-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.page{display:none}.page.on{display:block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:14px 18px 14px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--raised)}
.row[disabled]{opacity:.45;pointer-events:none}
.ico{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--raised);color:var(--muted)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;font-weight:600}
.txt small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.chev{width:20px;height:20px;color:var(--muted)}
.tick{width:22px;height:22px;color:var(--accent);opacity:0}
.row[aria-checked="true"] .tick{opacity:1}
.row.opt{min-height:64px;padding-left:20px}

.empty{display:grid;place-items:center;height:50vh;color:var(--muted);font-size:15px;text-align:center}
.about{padding:28px 22px}
.about h2{font-size:20px;font-weight:700}
.about p{color:var(--muted);margin-top:6px;font-size:15px}
.about .ver{margin-top:18px;color:var(--text);font-size:15px}

nav{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:5;
  width:min(calc(100% - 28px),520px);height:84px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:42px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tab{flex:1;height:64px;margin:0 2px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.tab.on{background:var(--raised);color:var(--text)}
#add{flex:none;width:68px;height:68px;margin:0 6px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
#add svg{width:30px;height:30px;stroke-width:2.2}
#add:active{transform:scale(.94)}

#toast{position:fixed;left:50%;bottom:calc(120px + var(--sab));transform:translate(-50%,10px);opacity:0;z-index:6;
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title">Home</h1>
  </header>

  <main>
    <section class="page" data-page="home"><div class="empty">No novels yet</div></section>

    <section class="page" data-page="settings">
      <div class="card">
        <button class="row" data-go="settings/theme">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.4 0 2-.9 2-1.8 0-1.2-1-1.6-1-2.7 0-.9.7-1.5 1.6-1.5H17a4 4 0 004-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r=".6"/><circle cx="10" cy="7.5" r=".6"/><circle cx="14.5" cy="7.5" r=".6"/></svg></span>
          <span class="txt"><b>Theme</b><small id="sub-theme"></small></span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="row" data-go="settings/design">
          <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></svg></span>
          <span class="txt"><b>Design style</b><small id="sub-design"></small></span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="row" data-go="settings/general">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></span>
          <span class="txt"><b>General</b><small>Week start, backup and data</small></span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="row" data-go="settings/about">
          <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
          <span class="txt"><b>About</b><small>Version 1.0.0</small></span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

    <section class="page" data-page="settings/theme"><div class="card">
      <button class="row opt" role="radio" data-set="theme" data-val="dark"><span class="txt"><b>Dark</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" role="radio" data-set="theme" data-val="light"><span class="txt"><b>Light</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" role="radio" data-set="theme" data-val="system"><span class="txt"><b>System</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div></section>

    <section class="page" data-page="settings/design"><div class="card">
      <button class="row opt" role="radio" data-set="bg" data-val="dots"><span class="txt"><b>Dots</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" role="radio" data-set="bg" data-val="grid"><span class="txt"><b>Grid</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" role="radio" data-set="bg" data-val="none"><span class="txt"><b>Plain</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div></section>

    <section class="page" data-page="settings/general"><div class="card">
      <button class="row opt" role="radio" data-set="week" data-val="saturday"><span class="txt"><b>Week starts on Saturday</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" role="radio" data-set="week" data-val="sunday"><span class="txt"><b>Week starts on Sunday</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" role="radio" data-set="week" data-val="monday"><span class="txt"><b>Week starts on Monday</b></span><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="row opt" disabled><span class="txt"><b>Backup and data</b><small>Coming soon</small></span></button>
    </div></section>

    <section class="page" data-page="settings/about"><div class="card about">
      <h2>Novel Tracker DB</h2>
      <p>Keep the novels you read and the details that matter.</p>
      <p class="ver">Version 1.0.0</p>
    </div></section>
  </main>

  <nav>
    <button class="tab" data-go="home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>Home</button>
    <button id="add" aria-label="Add novel"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-go="settings" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>Settings</button>
  </nav>
  <div id="toast" role="status"></div>
</div>

<script>
(function(){
  var KEY="ntdb:settings", S={theme:"dark",bg:"dots",week:"monday"};
  var LABEL={dark:"Dark",light:"Light",system:"System",dots:"Dots",grid:"Grid",none:"Plain"};
  var TITLES={"home":"Home","settings":"Settings","settings/theme":"Theme","settings/design":"Design style","settings/general":"General","settings/about":"About"};
  var mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;

  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in S){if(o&&typeof o[k]==="string")S[k]=o[k];}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  function apply(){
    var t=S.theme==="system"?(mq&&!mq.matches?"light":"dark"):S.theme;
    var h=document.documentElement;
    h.setAttribute("data-theme",t);h.setAttribute("data-bg",S.bg);
    document.querySelector('meta[name="theme-color"]').setAttribute("content",t==="light"?"#f6f5f3":"#0b0b0c");
    document.getElementById("sub-theme").textContent=LABEL[S.theme];
    document.getElementById("sub-design").textContent="Background: "+LABEL[S.bg];
    var opts=document.querySelectorAll("[data-set]");
    for(var i=0;i<opts.length;i++){opts[i].setAttribute("aria-checked",S[opts[i].dataset.set]===opts[i].dataset.val?"true":"false");}
  }

  function route(){
    var r=location.hash.slice(1)||"home";if(!TITLES[r])r="home";
    var pages=document.querySelectorAll(".page");
    for(var i=0;i<pages.length;i++){pages[i].classList.toggle("on",pages[i].dataset.page===r);}
    document.getElementById("title").textContent=TITLES[r];
    document.getElementById("back").style.display=r.indexOf("/")>-1?"flex":"none";
    var tabs=document.querySelectorAll("[data-tab]");
    for(var j=0;j<tabs.length;j++){tabs[j].classList.toggle("on",tabs[j].dataset.tab===r.split("/")[0]);}
    document.querySelector("main").scrollTop=0;
  }

  var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},1800);}

  document.addEventListener("click",function(e){
    var el=e.target.closest("button");if(!el)return;
    if(el.dataset.go){location.hash="#"+el.dataset.go;}
    else if(el.dataset.set){S[el.dataset.set]=el.dataset.val;save();apply();}
    else if(el.id==="add"){toast("Add novel is coming soon");}
    else if(el.id==="back"){if(history.length>1)history.back();else location.hash="#settings";}
  });
  window.addEventListener("hashchange",route);
  if(mq){var f=function(){if(S.theme==="system")apply();};mq.addEventListener?mq.addEventListener("change",f):mq.addListener(f);}

  apply();route();
})();
</script>
</body>
</html>
