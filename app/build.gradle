
plugins {
    id 'com.android.application'
}

android {
    namespace 'org.axon.noveltracker'
    compileSdk 35

    defaultConfig {
        applicationId 'org.axon.noveltracker'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
